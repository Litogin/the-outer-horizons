- type: entity
  name: тяпка
  parent: OH14_BaseItem
  id: OH14_ToolMiniHoe
  description: Используй чтобы убрать ебучие сорняки с гидропоники.
  components:
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {state: icon}
          False: {state: icon_inworld}
  - type: Tag
    tags:
    - Hoe
    - BotanyHoe
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/Hydroponics/hoe.rsi
    layers:
    - state: icon_inworld
      map: ["base"]
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    damage:
      types:
        Slash: 3
  - type: Item
    sprite: _OuterHorizons/Objects/Tools/Hydroponics/hoe.rsi
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  name: кусачки
  parent: OH14_BaseItem
  id: OH14_ToolClippers
  description: Можно типо образец у растения забрать хз.
  components:
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {state: icon}
          False: {state: icon_inworld}
  - type: Tag
