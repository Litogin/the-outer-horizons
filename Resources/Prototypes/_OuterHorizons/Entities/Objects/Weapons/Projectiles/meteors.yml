- type: entity
  parent: OH14_BasicMeteor
  id: OH14_MeteorLarge
  suffix: Large
  components:
  - type: Sprite
    state: big
  - type: Explosive
    totalIntensity: 15
    maxIntensity: 20
  - type: Destructible
    thresholds:
