        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ExplodeBehavior
      - !type:WeightedSpawnEntityBehavior
        weightedEntityTable: "OH14_MeteorSpawnAsteroidWallTable"
        spawnOffset: 1
        minSpawn: 0
        maxSpawn: 3
        spawnAfter: 0.5
