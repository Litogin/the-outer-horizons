- type: entity
  name: ПП "Атарч"
  parent: [BaseWeaponSubMachineGun, OH14_BaseItem]
  id: OH14_WeaponSMGAtarch
  description: Оружие для самообороны в космосе. В стародавние времена космонавтам было крайне нелегко справляться с отдачей и отлетающими гильзами, данное оружие (почти) решает эти проблемы.
  components:
  - type: Item
    sprite: _OuterHorizons/Objects/Weapons/Guns/atarch.rsi
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        enum.GunVisualLayers.Base:
          True: {sprite: _OuterHorizons/Objects/Weapons/Guns/atarch.rsi}
          False: {sprite: _OuterHorizons/Objects/Weapons/Guns/atarch.rsi}
        enum.GunVisualLayers.Mag:
          True: {sprite: _OuterHorizons/Objects/Weapons/Guns/atarch.rsi}
          False: {sprite: _OuterHorizons/Objects/Weapons/Guns/atarch.rsi}
  - type: Clothing
    sprite: _OuterHorizons/Objects/Weapons/Guns/atarch.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: Sprite
    sprite: _OuterHorizons/Objects/Weapons/Guns/atarch.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    availableModes:
    - SemiAuto
    - FullAuto
    fireRate: 5
    soundGunshot:
      path: /Audio/_OuterHorizons/Guns/Gun/smg_fire.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: OH14_MagazineSMGAtarch
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistolSubMachineGun
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
