- type: entity
  name: кирка
  parent: OH14_BaseItem
  id: OH14_Pickaxe
  description: Доисторическая ковырялка для каменных пород.
  components:
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {state: pickaxe}
          False: {state: inworld}
  - type: Sprite
    sprite: _OuterHorizons/Objects/Weapons/Melee/pickaxe.rsi
    layers:
    - state: inworld
      map: ["base"]
  - type: MeleeWeapon
    attackRate: 0.7
    wideAnimationRotation: -135
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
      params:
        volume: -5
    damage:
      groups:
        Brute: 5
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      groups:
        Brute: 10
      types:
        Structural: 30
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
    - 1,1,1,2
    sprite: _OuterHorizons/Objects/Weapons/Melee/pickaxe.rsi
    storedRotation: -45
  - type: UseDelay
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  parent: OH14_BaseItem
  id: OH14_MiningDrill
  name: ручной бур
  description: Компактный бур для шахтерских изысканий. В отличие от обычных инструментов, имеет фирменную бирюзовую расцветку.
  components:
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {state: icon}
          False: {state: inworld}
  - type: Item
    size: Normal
    storedRotation: 0
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/mining_drill.rsi
    layers:
    - state: inworld
      map: ["base"]
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -90
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"
    attackRate: 1.5
    damage:
      groups:
        Brute: 5
      types:
        Structural: 30
