- type: entity
  parent: [ OH14_ItemSFXSmall, IDCardStandard ]
  id: OH14_IDCardBasic
  categories: [ ForkFiltered ]
  name: ID карта
  description: Паспорт, кошелек, все в одной пластиковой карточке, которую легко потерять.
  components:
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Misc/id_cards.rsi}
          False: {sprite: _OuterHorizons/Objects/Misc/id_cards_inworld.rsi}
        icon:
          True: {sprite: _OuterHorizons/Objects/Misc/id_cards.rsi}
          False: {sprite: _OuterHorizons/Objects/Misc/id_cards_inworld.rsi}
  - type: Sprite
    sprite: _OuterHorizons/Objects/Misc/id_cards_inworld.rsi
    layers:
    - state: silver
      map: ["base"]
    - state: idpilot
      map: ["icon"]
  - type: PresetIdCard
    job: Passenger
  - type: Item
    sprite: _OuterHorizons/Objects/Misc/id_cards.rsi
  - type: Clothing
    slots:
    - neck
    sprite: _OuterHorizons/Objects/Misc/id_cards.rsi

