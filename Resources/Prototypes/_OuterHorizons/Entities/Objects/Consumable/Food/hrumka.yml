- type: entity
  parent: OH14_BaseItem
  id: OH14_FoodHrumka
  name: сухой перекус
  suffix: Еда
  description: Питательный батончик неизвестного происхождения, ешьте на свой страх и риск.
  components:
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {state: icon}
          False: {state: icon_inworld}
  - type: Sprite
    sprite: _OuterHorizons/Objects/Consumable/Food/hrumka.rsi
    layers:
    - state: icon_inworld
      map: ["base"]
  - type: Item
    size: Tiny
    storedOffset: 1,-1
  - type: Tag
    tags:
      - FoodSnack
  - type: SpawnItemsOnUse
    items:
      - id: OH14_FoodHrumkaTrash
      - id: OH14_FoodHrumkaBar
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: FoodSnackBase
  id: OH14_FoodHrumkaBar
  categories: [ ForkFiltered ]
  name: сухой перекус Hrumka
  suffix: Еда
  description: Питательный батончик неизвестного происхождения, ешьте на свой страх и риск.
  components:
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {state: icon-open}
          False: {state: icon-open_inworld}
  - type: FlavorProfile
    flavors:
      - chocolate
  - type: Sprite
    sprite: _OuterHorizons/Objects/Consumable/Food/hrumka.rsi
    layers:
    - state: icon-open_inworld
      map: ["base"]
  - type: Item
    storedOffset: 1,-2
  - type: Tag
    tags:
      - FoodSnack
      - ReptilianFood
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Theobromine
          Quantity: 3
        - ReagentId: CocoaPowder
          Quantity: 1

- type: entity
  categories: [ HideSpawnMenu ]
  parent: FoodPacketTrash
  id: OH14_FoodHrumkaTrash
  name: обертка
  components:
  - type: Sprite
    sprite: _OuterHorizons/Objects/Consumable/Food/hrumka.rsi
    state: trash
