- type: entity
  abstract: true
  parent: DrinkVisualsAll
  id: OH14_DrinkVisualsAllFilled
  components:
  - type: Sprite
    layers:
    - state: fill-5
      map: ["enum.SolutionContainerLayers.Fill"]
    - state: icon_empty
      map: ["enum.OpenableVisuals.Layer"]

- type: entity
  parent: DrinkBottlePlasticBaseFull
  id: OH14_DrinkBottleWater
  suffix: Провиант
  name: бутылка
  description: Небольшая бутылка для жидкостей, с навороченой крышкой для питья. Роскошь.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: Sprite
    sprite: _OuterHorizons/Objects/Consumable/Drinks/waterbottle.rsi
  - type: FitsInDispenser
    solution: drink

- type: entity
  parent: [OH14_DrinkVisualsAllFilled, OH14_DrinkBottleWater]
  id: OH14_DrinkBottleWaterFull
  suffix: Провиант, Заполнен
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: Water
          Quantity: 30
  - type: Sprite
    sprite: _OuterHorizons/Objects/Consumable/Drinks/waterbottle.rsi
  - type: Label
    currentLabel: reagent-name-water
