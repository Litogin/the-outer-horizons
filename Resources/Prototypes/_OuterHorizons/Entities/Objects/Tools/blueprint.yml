- type: entity
  parent: [ OH14_ItemSFXPaper, OH14_BaseItem ]
  id: OH14_BaseBlueprint
  name: чертеж
  description: Старый-синий чертеж, возможно в нем есть что-нибудь полезное.
  abstract: true
  components:
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {state: icon}
          False: {state: inworld}
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/blueprint.rsi
    layers:
    - state: inworld
      map: ["base"]
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
    storedSprite:
      sprite: _OuterHorizons/Objects/Tools/blueprint.rsi
      state: storage
  - type: Blueprint
  - type: StaticPrice
    price: 1000
  - type: Tag
    tags:
    - BlueprintAutolathe
    - OH14_Tools

- type: entity
  parent: OH14_BaseBlueprint
  id: OH14_BlueprintTest
  name: чертеж
  components:
  - type: Blueprint
    providedRecipes:
    - SeismicCharge

- type: entity
  parent: OH14_BaseBlueprint
  id: OH14_BlueprintShuttleWalls
  name: чертеж
  suffix: Стена шаттла
  components:
  - type: Label
    currentLabel: стена шаттла
  - type: Blueprint
    providedRecipes:
    - OH14_PanelsShuttle
