# База

- type: entity
  parent: [ OH14_ItemSFXMetallic, OH14_BasicMaterialStack ]
  id: OH14_BasicStackPanels
  abstract: true
  name: панель
  description: Большой конструкционный лист. Абляция в комплект не входит.
  components:
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/panels.rsi
  - type: Item
    sprite: _OuterHorizons/Objects/Materials/panels.rsi
  - type: Appearance

# Обычная

- type: entity
  parent: OH14_BasicStackPanels
  id: OH14_Panel
  name: панель
  suffix: 16
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      OH14_Panel: 100
  - type: Item
    heldPrefix: panel
  - type: Stack
    count: 16
    stackType: OH14_Panel
    baseLayer: base
    layerStates:
    - panel
    - panel_2
    - panel_3
  - type: Sprite
    layers:
    - state: panel_3
      map: ["base"]

- type: entity
  parent: OH14_Panel
  id: OH14_Panel8
  suffix: 8
  components:
  - type: Sprite
    state: panel_2
  - type: Stack
    stackType: OH14_Panel
    count: 8

- type: entity
  parent: OH14_Panel
  id: OH14_Panel1
  suffix: 1
  components:
  - type: Sprite
    state: panel
  - type: Stack
    stackType: OH14_Panel
    count: 1

