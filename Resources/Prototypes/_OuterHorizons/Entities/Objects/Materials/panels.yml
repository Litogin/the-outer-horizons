- type: entity
  parent: [ OH14_ItemSFXMetallic, OH14_SheetBase ]
  id: OH14_SheetPanelsBasic
  name: панели
  description: Плоские панели для будущих стен. Герметичны, но все еще разрушаемые.
  suffix: Full
  components:
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Materials/panels.rsi}
          False: {sprite: _OuterHorizons/Objects/Materials/panels_inworld.rsi}
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      OH14_Panels: 100
  - type: Stack
    count: 16
    stackType: OH14_Panels
    baseLayer: base
    layerStates:
    - panel
    - panel_2
    - panel_3
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/panels_inworld.rsi
    state: panel_3
    layers:
    - state: panel_3
      map: ["base"]
  - type: Item
    sprite: _OuterHorizons/Objects/Materials/panels.rsi
    heldPrefix: panel
  - type: Appearance

- type: entity
  parent: OH14_SheetPanelsBasic
  id: OH14_SheetPanelsBasic8
