# База

- type: entity
  parent: [ OH14_ItemSFXSmall, OH14_BaseItem ]
  id: OH14_BasicComponents
  abstract: true
  name: компонент
  suffix: "Компоненты"
  description: Бесполезная хрень, которая почему то требуется для ваших кустарных изысканий.
  components:
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/components.rsi
  - type: Item
    # sprite: _OuterHorizons/Objects/Materials/components.rsi
  - type: Appearance

### Рукоятка
# Обычная и длинная. Ну и приклад

- type: entity
  parent: OH14_BasicComponents
  id: OH14_Handle
  name: рукоятка
  description: Ну не держать ведь тебе инструменты за корпус?
  components:
  - type: Tag
    tags:
    - OH14_Handle
  - type: Item
    size: Small
  - type: Sprite
    state: l_handle

- type: entity
  parent: OH14_BasicComponents
  id: OH14_MediumHandle
  name: длинная рукоятка
  description: Ну не держать ведь тебе инструменты за корпус?
  components:
  - type: Tag
    tags:
    - OH14_MediumHandle
  - type: Item
    size: Small
  - type: Sprite
    state: m_handle

- type: entity
  parent: OH14_BasicComponents
  id: OH14_Buttstock
  name: приклад
  description: Уверяю вас, это не для огнестрельного оружия.
  components:
  - type: Tag
    tags:
    - OH14_Buttstock
  - type: Item
    size: Small
  - type: Sprite
    state: buttstock

### Камеры сгорания
# Медная и теплоустойчивая

