# База

- type: entity
  parent: [ OH14_ItemSFXSmall, OH14_BaseItem ]
  id: OH14_BasicComponents
  abstract: true
  name: компонент
  suffix: "Компоненты"
  description: Бесполезная хрень, которая почему то требуется для ваших кустарных изысканий.
  components:
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Materials/components.rsi}
          False: {sprite: _OuterHorizons/Objects/Materials/components_inworld.rsi}
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/components_inworld.rsi
  - type: Item
    # sprite: _OuterHorizons/Objects/Materials/components.rsi
  - type: Appearance

### Рукоятка
# Обычная и длинная. Ну и приклад

- type: entity
  parent: OH14_BasicComponents
  id: OH14_Handle
  name: рукоятка
  description: Ну не держать ведь тебе инструменты за корпус?
  components:
  - type: Tag
    tags:
    - OH14_Handle
  - type: Item
    size: Small
  - type: Sprite
    layers:
    - state: l_handle
      map: ["base"]

- type: entity
  parent: OH14_BasicComponents
  id: OH14_MediumHandle
  name: длинная рукоятка
  description: Ну не держать ведь тебе инструменты за корпус?
  components:
  - type: Tag
    tags:
    - OH14_MediumHandle
  - type: Item
    size: Small
  - type: Sprite
    layers:
    - state: m_handle
      map: ["base"]

- type: entity
  parent: OH14_BasicComponents
  id: OH14_Buttstock
  name: приклад
  description: Уверяю вас, это не для огнестрельного оружия.
  components:
  - type: Tag
    tags:
    - OH14_Buttstock
  - type: Item
    size: Small
  - type: Sprite
    layers:
    - state: buttstock
      map: ["base"]

