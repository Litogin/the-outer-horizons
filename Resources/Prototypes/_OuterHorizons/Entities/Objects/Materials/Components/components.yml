### Корпуса
# Питания

- type: entity
  parent: OH14_BasicComponents
  id: OH14_PowerUnit
  name: каркас БП
  description: Нужен чтобы подать адекватое напряжение в устройство. И тебе бы припаять сюда пару деталек.
  components:
  - type: Construction
    graph: OH14_PowerUnit
    node: start
  - type: Sprite
    layers:
    - state: power_unit
      map: ["base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Materials/components.rsi}
          False: {sprite: _OuterHorizons/Objects/Materials/components_inworld.rsi}
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          start: { state: power_unit }
          frame1: { state: power_unit_2 }

- type: entity
  parent: OH14_BasicComponents
  id: OH14_PowerUnitComplete
  name: блок питания
  description: Нужен чтобы подать адекватое напряжение в устройство.
