# Плата

- type: entity
  parent: OH14_BasicComponents
  id: OH14_AnalogBoard
  name: каркас анал. платы
  description: Простейшее вычислительное устройство. К сожалению не потянет крафтмайн. И тебе бы припаять сюда пару деталек.
  components:
  - type: Construction
    graph: OH14_AnalogBoard
    node: start
  - type: Sprite
    layers:
    - state: analog_board
      map: ["base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Materials/components.rsi}
          False: {sprite: _OuterHorizons/Objects/Materials/components_inworld.rsi}
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          start: { state: analog_board }
          frame1: { state: analog_board_2 }

- type: entity
  parent: OH14_BasicComponents
  id: OH14_AnalogBoardComplete
  name: аналоговая плата
  description: Простейшее вычислительное устройство. К сожалению не потянет крафтмайн.
  components:
  - type: Tag
    tags:
    - OH14_AnalogBoardComplete
  - type: Construction
    graph: OH14_AnalogBoard
    node: OH14_AnalogBoardComplete
  - type: Sprite
    layers:
    - state: analog_board_3
      map: ["base"]

