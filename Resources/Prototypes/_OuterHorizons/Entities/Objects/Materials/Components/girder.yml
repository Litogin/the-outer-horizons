# Каркасы

- type: entity
  parent: [ OH14_ItemSFXMetallic, OH14_BasicMaterialStack ]
  id: OH14_SheetGirder
  name: каркасы
  suffix: 16
  components:
  # - type: InworldSprite
  # - type: GenericVisualizer
  #   visuals:
  #     enum.InworldSpriteState.State:
  #       base:
  #         True: {sprite: _OuterHorizons/Objects/Materials/girder.rsi}
  #         False: {sprite: _OuterHorizons/Objects/Materials/girder.rsi}
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      OH14_Girders: 100
  - type: Stack
    count: 16
    stackType: OH14_StackGirders
    baseLayer: base
    layerStates:
    - girder
    - girder_2
    - girder_3
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/girder.rsi
    layers:
    - state: girder_3
      map: ["base"]
  - type: Item
    heldPrefix: girder
  - type: Appearance
  - type: FloorTile
    outputs:
    - OH14_Lattice

- type: entity
  parent: OH14_SheetGirder
  id: OH14_SheetGirder8
  suffix: 8
  components:
  - type: Sprite
    state: girder_2
  - type: Stack
    stackType: OH14_StackGirders
    count: 8

- type: entity
  parent: OH14_SheetGirder
  id: OH14_SheetGirder1
  suffix: 1
  components:
  - type: Sprite
    state: girder
  - type: Stack
    stackType: OH14_StackGirders
    count: 1

