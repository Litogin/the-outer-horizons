# База

- type: entity
  parent: OH14_BasicMaterialStack
  id: OH14_BasicStackCoil
  abstract: true
  name: проволка
  description: (не) тонкая проволка, специально для ваших кустарных изысканий.
  components:
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Materials/coils.rsi}
          False: {sprite: _OuterHorizons/Objects/Materials/coils_inworld.rsi}
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/coils_inworld.rsi
  - type: Item
    sprite: _OuterHorizons/Objects/Materials/coils.rsi
  - type: Appearance

# Железная

- type: entity
  parent: OH14_BasicStackCoil
  id: OH14_CoilIron
  name: железная проволка
  suffix: 16
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      OH14_CoilIron: 100
  - type: Item
    heldPrefix: iron
  - type: Stack
    count: 16
    stackType: OH14_CoilIron
    baseLayer: base
    layerStates:
    - iron
    - iron_2
    - iron_3
  - type: Sprite
    layers:
    - state: iron_3
      map: ["base"]

- type: entity
  parent: OH14_CoilIron
  id: OH14_CoilIron8
  suffix: 8
  components:
  - type: Sprite
    state: iron_2
  - type: Stack
    stackType: OH14_CoilIron
    count: 8

- type: entity
  parent: OH14_CoilIron
  id: OH14_CoilIron1
  suffix: 1
  components:
  - type: Sprite
    state: iron
  - type: Stack
    stackType: OH14_CoilIron
    count: 1

