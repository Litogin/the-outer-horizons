# База

- type: entity
  parent: [ OH14_ItemSFXSmall, OH14_BasicMaterialStack ]
  id: OH14_BasicStackComponents
  abstract: true
  name: компонент
  description: Бесполезная хрень, которая почему то требуется для ваших кустарных изысканий.
  components:
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/components.rsi
  - type: Item
    # sprite: _OuterHorizons/Objects/Materials/components.rsi
  - type: Appearance

### Запчасти
# Обычные

- type: entity
  parent: OH14_BasicStackComponents
  id: OH14_Component
  name: компонент
  description: Механический компонент для более продвинутых структур и устройств.
  suffix: "8, Компоненты"
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      OH14_Component: 100
  - type: Item
    size: Tiny
  - type: Stack
    count: 8
    stackType: OH14_StackComponent
    baseLayer: base
    layerStates:
    - sparepart
    - sparepart_2
    - sparepart_3
  - type: Sprite
    layers:
    - state: sparepart_3
      map: ["base"]

- type: entity
  parent: OH14_Component
  id: OH14_Component4
  suffix: "4, Компоненты"
  components:
  - type: Sprite
    state: sparepart_2
  - type: Stack
    stackType: OH14_StackComponent
    count: 4

- type: entity
  parent: OH14_Component
  id: OH14_Component1
  suffix: "1, Компоненты"
  components:
  - type: Sprite
    state: sparepart
  - type: Stack
    stackType: OH14_StackComponent
    count: 1

