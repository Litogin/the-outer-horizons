# База

- type: entity
  parent: [ OH14_ItemSFXStone, OH14_BasicMaterialStack ]
  id: OH14_BasicStackCobblestone
  abstract: true
  name: рудный булыжник
  description: Горстка каменных облокмков, по всей видимости с рудой внутри
  components:
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/ores_cobblestone.rsi
  - type: Item
    sprite: _OuterHorizons/Objects/Materials/DEBUG_materials.rsi
    heldPrefix: ore
  - type: Appearance
  - type: Tag
    tags:
    - OH14_StackCobblestone

# Камень

- type: entity
  parent: OH14_BasicStackCobblestone
  id: OH14_Cobblestone
  name: булыжник
  description: Горстка каменных облокмков
  suffix: 16
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      OH14_Cobblestone: 100
  - type: Stack
    count: 16
    stackType: OH14_StackCobblestone
    baseLayer: base
    layerStates:
    - basic
    - basic_2
    - basic_3
  - type: Sprite
    layers:
    - state: basic_3
      map: ["base"]

- type: entity
  parent: OH14_Cobblestone
  id: OH14_Cobblestone8
  suffix: 8
  components:
  - type: Sprite
    state: basic_2
  - type: Stack
    stackType: OH14_StackCobblestone
    count: 8

- type: entity
  parent: OH14_Cobblestone
  id: OH14_Cobblestone1
  suffix: 1
  components:
  - type: Sprite
    state: basic
  - type: Stack
    stackType: OH14_StackCobblestone
    count: 1

