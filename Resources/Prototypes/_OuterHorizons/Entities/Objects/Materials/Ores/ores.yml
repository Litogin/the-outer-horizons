# База

- type: entity
  parent: [ OH14_ItemSFXStone, OH14_BasicMaterialStack ]
  id: OH14_BasicStackOre
  abstract: true
  name: руда
  description: Обработанный кусок руды для переплавки
  components:
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/ores.rsi
  - type: Item
    sprite: _OuterHorizons/Objects/Materials/DEBUG_materials.rsi
    heldPrefix: ore
  - type: Appearance
  - type: Tag
    tags:
    - OH14_StackOre

# Железо

- type: entity
  parent: OH14_BasicStackOre
  id: OH14_OreIron
  name: железная руда
  suffix: 16
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      OH14_OreIron: 100
  - type: Stack
    count: 16
    stackType: OH14_StackIron
    baseLayer: base
    layerStates:
    - iron
    - iron_2
    - iron_3
  - type: Sprite
    layers:
    - state: iron_3
      map: ["base"]

- type: entity
  parent: OH14_OreIron
  id: OH14_OreIron8
  suffix: 8
  components:
  - type: Sprite
    state: iron_2
  - type: Stack
    stackType: OH14_StackIron
    count: 8

- type: entity
  parent: OH14_OreIron
  id: OH14_OreIron1
  suffix: 1
  components:
  - type: Sprite
    state: iron
  - type: Stack
    stackType: OH14_StackIron
    count: 1

