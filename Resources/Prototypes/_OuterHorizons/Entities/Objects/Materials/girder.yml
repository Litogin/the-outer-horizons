- type: entity
  parent: [ OH14_ItemSFXMetallic, OH14_SheetBase ]
  id: OH14_SheetGirder
  name: каркасы
  suffix: Full
  components:
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Materials/girder.rsi}
          False: {sprite: _OuterHorizons/Objects/Materials/girder.rsi}
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      OH14_Girders: 100
  - type: Stack
    count: 16
    stackType: OH14_Girders
    baseLayer: base
    layerStates:
    - girder
    - girder_2
    - girder_3
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/girder.rsi
    state: girder_3
    layers:
    - state: girder_3
      map: ["base"]
  - type: Item
    heldPrefix: girder
  - type: Appearance
  - type: FloorTile
    outputs:
    - OH14_Lattice

