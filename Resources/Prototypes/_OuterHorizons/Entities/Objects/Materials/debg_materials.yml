- type: entity
  abstract: true
  parent: OH14_BaseItem
  id: OH14_SheetBase
  description: Различные приколы из которых можно сделать все что душе угодно. Я не шучу.
  components:
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Materials/DEBUG_materials.rsi}
          False: {sprite: _OuterHorizons/Objects/Materials/DEBUG_materials_inworld.rsi}
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/DEBUG_materials_inworld.rsi
  - type: Item
    sprite: _OuterHorizons/Objects/Materials/DEBUG_materials.rsi
    size: Normal
  - type: StaticPrice
    price: 0
  - type: Tag
    tags:
    - OH14_Sheet
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: [ OH14_ItemSFXMetallic, OH14_SheetBase ]
  id: OH14_SheetMaterials
  name: Материалы
  suffix: Full
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      OH14_Materials: 100
  - type: Stack
    count: 16
    stackType: OH14_Materials
    baseLayer: base
    layerStates:
    - material
    - material_2
    - material_3
  - type: Sprite
    state: material_3
    layers:
    - state: material_3
      map: ["base"]
  - type: Item
    heldPrefix: material
  - type: Appearance
  - type: FloorTile
    outputs:
    - OH14_PlatingLattice
    - OH14_Plating

