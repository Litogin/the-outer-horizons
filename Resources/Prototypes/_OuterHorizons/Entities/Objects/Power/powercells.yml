- type: entity
  id: OH14_BasicPowerCell
  abstract: true
  parent: OH14_BaseItem
  components:
  - type: InworldSprite
  - type: Item
    sprite: _OuterHorizons/Objects/Power/power_cells.rsi
  - type: Battery
    pricePerJoule: 0.15
  - type: PowerCell
  - type: Explosive
    explosionType: Default
    maxIntensity: 200
    intensitySlope: 1.5
  - type: Sprite
    sprite: _OuterHorizons/Objects/Power/power_cells.rsi
  - type: SolutionContainerManager
    solutions:
      battery:
        maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Extractable
    juiceSolution:
      reagents:
        - ReagentId: Zinc
          Quantity: 5
  - type: Riggable
  - type: Appearance
  - type: BatteryVisuals
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: {visible: true, state: o2}
          Neither: {visible: true, state: o1}
          Empty: {visible: false}
      enum.InworldSpriteState.State:
        enum.PowerCellVisualLayers.Base:
          True: {sprite: _OuterHorizons/Objects/Power/power_cells.rsi}
          False: {sprite: _OuterHorizons/Objects/Power/power_cells.rsi}
        enum.PowerCellVisualLayers.Unshaded:
          True: {sprite: _OuterHorizons/Objects/Power/power_cells.rsi}
          False: {sprite: _OuterHorizons/Objects/Power/power_cells.rsi}

# Маленькая

- type: entity
  id: OH14_PowerCellMedium
  parent: [ OH14_ItemSFXSmall, OH14_BasicPowerCell ]
  name: батарейка
  description: Не поджигать, не мочить и не вскрывать, на вкус как смерть в отравлении тяжелыми металлами. До вас уже все проверяли.
  suffix: Full
  components:
  - type: Construction
    graph: OH14_PowerCellMedium
    node: OH14_PowerCellMediumEmpty
  - type: Tag
    tags:
      - PowerCell
      - OH14_Tools
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: small
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: small_o2
      shader: unshaded
  - type: Battery
    maxCharge: 720
    startingCharge: 720
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: {visible: true, state: small_o2}
          Neither: {visible: true, state: small_o1}
          Empty: {visible: false}
      enum.InworldSpriteState.State:
        enum.PowerCellVisualLayers.Base:
          True: {sprite: _OuterHorizons/Objects/Power/power_cells.rsi}
          False: {sprite: _OuterHorizons/Objects/Power/power_cells.rsi}
        enum.PowerCellVisualLayers.Unshaded:
          True: {sprite: _OuterHorizons/Objects/Power/power_cells.rsi}
          False: {sprite: _OuterHorizons/Objects/Power/power_cells.rsi}

- type: entity
  id: OH14_PowerCellMediumEmpty
  suffix: Empty
  parent: OH14_PowerCellMedium
  components:
  - type: Sprite
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: small
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: small_o2
        shader: unshaded
        visible: false
  - type: Battery
    maxCharge: 720
    startingCharge: 0

- type: entity
  parent: OH14_BasicComponents
  id: OH14_PowerCellMediumFrame
  name: каркас батарейки
  description: В иной ситуации это был бы патрон.
  components:
  - type: Construction
    graph: OH14_PowerCellMedium
    node: start
  - type: Sprite
    sprite: _OuterHorizons/Objects/Power/power_cells.rsi
    state: small_frame

# Большая

- type: entity
  id: OH14_PowerCellBig
  parent: [ OH14_ItemSFXAlt, OH14_BasicPowerCell ]
  name: аккумулятор
  description: Огромная батарейка, большая батарейка, хорошая батарейка.
  suffix: Full
  components:
  - type: Construction
    graph: OH14_PowerCellBig
    node: OH14_PowerCellBigEmpty
  - type: Tag
    tags:
      - OH14_PowerCellBig
  - type: Item
    heldPrefix: medium
    size: Normal
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: medium
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: medium_o2
      shader: unshaded
  - type: Battery
    maxCharge: 3600
    startingCharge: 3600
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: {visible: true, state: medium_o2}
          Neither: {visible: true, state: medium_o1}
          Empty: {visible: false}
      enum.InworldSpriteState.State:
        enum.PowerCellVisualLayers.Base:
          True: {sprite: _OuterHorizons/Objects/Power/power_cells.rsi}
          False: {sprite: _OuterHorizons/Objects/Power/power_cells.rsi}
        enum.PowerCellVisualLayers.Unshaded:
          True: {sprite: _OuterHorizons/Objects/Power/power_cells.rsi}
          False: {sprite: _OuterHorizons/Objects/Power/power_cells.rsi}

- type: entity
  id: OH14_PowerCellBigEmpty
  suffix: Empty
  parent: OH14_PowerCellBig
  components:
  - type: Tag
    tags:
      - OH14_PowerCellBig
      - OH14_Tools
  - type: Sprite
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: medium
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: medium_o2
        shader: unshaded
        visible: false
  - type: Battery
    maxCharge: 3600
    startingCharge: 0

- type: entity
  parent: OH14_BasicComponents
  id: OH14_PowerCellBigFrame
  name: каркас аккумулятора
  description: В иной ситуации это был бы ящик.
  components:
  - type: Construction
    graph: OH14_PowerCellBig
    node: start
  - type: Sprite
    sprite: _OuterHorizons/Objects/Power/power_cells.rsi
    state: medium_frame
