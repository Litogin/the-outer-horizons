# Ледышка

- type: entity
  parent: OH14_SheetBase
  id: OH14_Ice
  name: лед
  suffix: Full
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:SpillBehavior
        solution: ice
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Extractable
    grindableSolutionName: ice
  - type: SolutionContainerManager
    solutions:
      ice:
        reagents:
        - ReagentId: Water
          Quantity: 30
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Materials/planet.rsi}
          False: {sprite: _OuterHorizons/Objects/Materials/planet.rsi}
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      OH14_Ice: 100
  - type: Stack
    count: 16
    stackType: OH14_Ice
    baseLayer: base
    layerStates:
    - ice
    - ice_2
    - ice_3
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/planet.rsi
    state: ice_3
    layers:
    - state: ice_3
      map: ["base"]
  - type: Item
    sprite: _OuterHorizons/Objects/Materials/planet.rsi
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#67E9FF"
      right:
      - state: inhand-right
        color: "#67E9FF"
  - type: Appearance

- type: entity
  parent: OH14_Ice
  id: OH14_Ice1
  suffix: Single
  components:
  - type: Sprite
    state: ice
  - type: Stack
    stackType: OH14_Ice
    count: 1
