# Канистры

- type: entity
  id: LootSpawnerGasCans75
  name: спавнер канистры
  categories: [ ForkFiltered ]
  parent: MarkerBase
  suffix: 75%, Любая
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: _OuterHorizons/Structures/Storage/canister.rsi
        state: yellow
