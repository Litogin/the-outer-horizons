# Лейтджойн

- type: entity
  id: OH14_SpawnPointUcoLateJoin
  suffix: UCO, Latejoin
  parent: SpawnPointJobBase
  categories: [ ForkFiltered ]
  name: точка спавна
  components:
  - type: SpawnPoint
    job_id: OH14_UcoRole
    spawn_type: LateJoin
