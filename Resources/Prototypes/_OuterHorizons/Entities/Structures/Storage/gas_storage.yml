- type: entity
  parent: OH14_BaseStructure
  id: OH14_BaseGasStorage
  abstract: true
  name: газовое хранилище
  description: Большое хранилище для хранения газов, имеет сразу 4 выхода с 4х сторон для первого слоя труб. Переносу не подлежит.
  components:
    - type: InteractionOutline
    - type: Transform
      # noRot: true
    - type: Appearance
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: Metallic
    - type: AtmosDevice
      requireAnchored: true
      joinSystem: true
    - type: PipeColorVisuals
    - type: AtmosPipeColor
    - type: NodeContainer
      nodes:
        port:
          !type:PortablePipeNode
          nodeGroupID: Pipe
          pipeDirection: Fourway
          volume: 1
    - type: Sprite
      # noRot: true
      sprite: _OuterHorizons/Structures/Storage/gas_storage.rsi
      layers:
        - state: pipe
          map: [ "enum.PipeVisualLayers.Pipe" ]
          renderingStrategy: Default
        - state: yellow
    - type: GasCanister
      gasMixture:
        volume: 5000
        moles: # List of gasses for easy reference
          - 0 # oxygen
          - 0 # nitrogen
          - 0 # CO2
          - 0 # Plasma
          - 0 # Tritium
          - 0 # Water vapor
          - 0 # Ammonia
          - 0 # N2O
          - 0 # Frezon
        temperature: 293.15
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:DumpCanisterBehavior

- type: entity
  parent: OH14_BaseGasStorage
  id: OH14_GasStorageGrey
  suffix: Пусто, Пустой
  components:
   - type: Sprite
     layers:
      - state: pipe
        map: [ "enum.PipeVisualLayers.Pipe" ]
        renderingStrategy: Default
      - state: grey

