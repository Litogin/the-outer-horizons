- type: entity
  id: OH14_AirlockGlass
  parent: OH14_Airlock
  name: стеклянный шлюз
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmack
  - type: Door
    occludes: false
  - type: Occluder
    enabled: false
  - type: Sprite
    sprite: _OuterHorizons/Structures/Doors/Airlocks/Glass/basic.rsi
  - type: AnimationPlayer
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49" # don't want this colliding with walls or they won't close
        density: 100
        mask:
        - FullTileMask
        layer:     #removed opaque from the layer, allowing lasers to pass through glass airlocks
        - GlassAirlockLayer
  - type: LayerChangeOnWeld
    unWeldedLayer: GlassAirlockLayer
    weldedLayer: GlassLayer
  # - type: Construction
  #   graph: Airlock
  #   node: glassAirlock
  - type: RadiationBlocker
    resistance: 2
  - type: Tag
    tags:
      - GlassAirlock

- type: entity
  id: OH14_AirlockExternalGlass
  parent: OH14_AirlockGlass
  name: внешний шлюз
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Doors/Airlocks/Glass/external.rsi
  - type: Door
    bumpOpen: false
    openSound:
      path: /Audio/_OuterHorizons/Machines/Airlock/heavy_open.ogg
    closeSound:
      path: /Audio/_OuterHorizons/Machines/Airlock/heavy_close.ogg
