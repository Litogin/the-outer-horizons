  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Atmospherics/pump_alt1.rsi
    layers:
    - sprite: _OuterHorizons/Structures/Misc/Atmospherics/pipe_alt1.rsi
      state: pipeStraight
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: pumpPressure
      map: ["enum.SubfloorLayers.FirstLayer"]
    - state: pumpPressureOn
      shader: unshaded
      map: [ "enum.SubfloorLayers.SecondLayer", "enabled" ]

