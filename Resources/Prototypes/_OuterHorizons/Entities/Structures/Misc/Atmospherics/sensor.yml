- type: entity
  id: OH14_AirSensor
  categories: [ ForkFiltered ]
  name: воздушный сенсор
  description: Требуется для стабильной работы воздушного терминала.
  parent: AirSensorBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Physics
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Clickable
  - type: InteractionOutline
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: Construction
    graph: OH14_GasPumpsVent
    node: OH14_AirSensor
  - type: Appearance
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _OuterHorizons/Structures/Misc/Atmospherics/sensor.rsi
    layers:
    - state: gsensor1
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { state: gsensor1 }
          False: { state: gsensor0 }
  - type: Tag
    tags:
    - AirSensor
    - ForceFixRotations

