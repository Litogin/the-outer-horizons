- type: entity
  id: OH14_GasPipeBroken
  parent: OH14_GasPipeBasic
  name: сломаная труба
  description: Газонюхи донюхались.
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Atmospherics/pipe.rsi
    drawdepth: ThinPipe
    state: pipeBroken
    layers:
      - state: pipeBroken
        map: [ "enum.PipeVisualLayers.Pipe" ]
  - type: AtmosPipeLayers
    numberOfPipeLayers: 1
  - type: Construction
    graph: OH14_GasPipe
    node: OH14_GasPipeBroken
  - type: Item
    size: Small
  - type: Destructible
    thresholds: # override parent to avoid recursive destruction
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: GuideHelp
    guides:
    - Pipes
    - PipeNetworks

- type: entity
  parent: OH14_BasicGasPipeLayer
  id: OH14_GasPipeManifold
  name: коннектор газовых труб
  description: Позволяет соеденить трубы разрозненных конфигураций в одну и наоборот.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Atmospherics/manifold.rsi
    layers:
    - state: pipeManifold
      map: [ "enum.PipeVisualLayers.Pipe" ]
  - type: AtmosPipeLayers
    pipeLayersLocked: true
  - type: PipeAppearance
    sprite:
    - { sprite: _OuterHorizons/Structures/Misc/Atmospherics/manifold.rsi, state: pipeConnector }
    - { sprite: _OuterHorizons/Structures/Misc/Atmospherics/manifold.rsi, state: pipeConnector_alt1 }
    - { sprite: _OuterHorizons/Structures/Misc/Atmospherics/manifold.rsi, state: pipeConnector_alt2 }
  - type: Construction
    graph: OH14_GasPipe
    node: OH14_GasPipeManifold
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    storedSprite:
      sprite: _OuterHorizons/Structures/Misc/Atmospherics/manifold.rsi
      state: storageManifold
  - type: NodeContainer
    nodes:
      south0:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
        pipeLayer: 0
        volume: 50
      south1:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
        pipeLayer: 1
        volume: 50
      south2:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
        pipeLayer: 2
        volume: 50
      north0:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: North
        pipeLayer: 0
        volume: 50
      north1:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: North
        pipeLayer: 1
        volume: 50
      north2:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: North
        pipeLayer: 2
        volume: 50
  - type: GasPipeManifold
  - type: AtmosMonitoringConsoleDevice
    navMapBlip: GasPipeManifold
    showAbsentConnections: false
  - type: AtmosDevice
  - type: Tag
    tags:
    - Unstackable
