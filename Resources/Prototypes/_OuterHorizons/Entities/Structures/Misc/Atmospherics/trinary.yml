- type: entity
  parent: OH14_GasPipeTrinaryBasic
  id: OH14_GasMixer
  name: газовый миксер
  description: Используется для смещения газов, получаемая смесь выходит в оранжевый порт.
  placement:
    mode: SnapgridCenter
  components:
    - type: SubFloorHide
      visibleLayers:
      - enum.SubfloorLayers.FirstLayer
      - enum.SubfloorLayers.SecondLayer
    - type: Sprite
      sprite: _OuterHorizons/Structures/Misc/Atmospherics/gasmixer.rsi
      layers:
        - sprite: _OuterHorizons/Structures/Misc/Atmospherics/pipe.rsi
          state: pipeTrinaryConnectors
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: gasMixer
          map: ["enum.SubfloorLayers.FirstLayer"]
        - state: gasMixer_on
          shader: unshaded
          map: [ "enum.SubfloorLayers.SecondLayer", "enabled" ]
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.FilterVisuals.Enabled:
          enabled:
            True: { state: gasMixer_unshaded }
            False: { state: gasMixer_on }
    - type: PipeColorVisuals
    - type: UserInterface
      interfaces:
        enum.GasMixerUiKey.Key:
          type: GasMixerBoundUserInterface
    - type: GasMixer
      enabled: false
      inletOne: inlet
      inletTwo: filter
    - type: Flippable
      mirrorEntity: GasMixerFlipped
    - type: Construction
      graph: OH14_GasPumpsTrinary
      node: OH14_GasMixer
    - type: AmbientSound
      enabled: false
      volume: -9
      range: 5
      sound:
        path: /Audio/Ambience/Objects/gas_hiss.ogg
    - type: AtmosMonitoringConsoleDevice
      navMapBlip: GasFlowRegulator
    - type: GuideHelp
      guides:
      - MixingAndFiltering

