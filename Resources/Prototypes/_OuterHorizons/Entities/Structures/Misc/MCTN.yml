- type: entity
  id: OH14_BasicMCTNode
  categories: [ ForkFiltered ]
  abstract: true
  components:
    - type: Physics
      bodyType: Static
      canCollide: false
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.25,-0.25,0.25,0.25"
          density: 20
          mask:
          - ItemMask
          restitution: 0.3
          friction: 0.2
    - type: ActivatableUI
      key: enum.MCTNConsoleUiKey.Key
    - type: UserInterface
      interfaces:
        enum.MCTNConsoleUiKey.Key:
          type: MCTNBoundUserInterface
    - type: NodeContainer
      examinable: true
      nodes:
        powerHV:
          !type:CableDeviceNode
          nodeGroupID: HVPower
        powerMV:
          !type:CableDeviceNode
          nodeGroupID: MVPower
        powerLV:
          !type:CableDeviceNode
          nodeGroupID: Apc

        pipe1:
          !type:PortPipeNode
          nodeGroupID: Pipe
          rotationsEnabled: false
          pipeDirection: All
          pipeLayer: 0
        pipe2:
          !type:PortPipeNode
          nodeGroupID: Pipe
          rotationsEnabled: false
          pipeDirection: All
          pipeLayer: 1
        pipe3:
          !type:PortPipeNode
          nodeGroupID: Pipe
          rotationsEnabled: false
          pipeDirection: All
          pipeLayer: 2
    - type: MCTN
      maxRange: 16
    - type: AccessReader

- type: entity
  id: MCTNTetherStub
  save: false

- type: entity
  parent: [OH14_BasicMCTNode, BaseMachinePowered]
  id: OH14_MCTNode
  name: МТ узел
  description: Многопоточный трасфер-узел, своего рода поводок для вашего корабля, если у вас нет электричества или топлива.
  components:
  - type: Construction
    graph: OH14_MCTNode
    node: OH14_MCTNode
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: Sprite
    snapCardinals: true
    sprite: _OuterHorizons/Structures/Misc/mctn.rsi
    state: icon
    # drawdepth: Overdoors

- type: entity
  parent: OH14_FrameBasic
  id: OH14_MCTNodeFrame
  name: каркас МТ узла
  components:
  - type: Construction
    graph: OH14_MCTNode
    node: OH14_MCTNodeFrame
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    snapCardinals: true
    sprite: _OuterHorizons/Structures/Misc/mctn.rsi
    state: frame
    # drawdepth: Overdoors
