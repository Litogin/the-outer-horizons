- type: entity
  id: OH14_WindowDirectional
  parent: OH14_BasicDirectionalStructure
  name: направленное окно
  description: Крайне восприимчимо к повреждениям, не царапать отверткой!
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Construction
    graph: OH14_WindowDirectional
    node: OH14_WindowDirectional
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150 #excess damage (nuke?). avoid computational cost of spawning entities.
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetIron1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks_directional.rsi
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Glass
  - type: InteractionPopup
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: comp-window-knock
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg
  - type: Sprite
    sprite: _OuterHorizons/Structures/Windows/basic_directional.rsi
    state: state0
  - type: Icon
    sprite: _OuterHorizons/Structures/Windows/basic_directional.rsi
    state: state0
