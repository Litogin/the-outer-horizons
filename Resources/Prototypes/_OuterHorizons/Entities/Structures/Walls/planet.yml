- type: entity
  parent: BaseWall
  id: OH14_BaseWallStone
  categories: [ ForkFiltered ]
  name: каменная порода
  suffix: Астероид
  description: Хранит руды внутри и грейтайдов снаружи.
  components:
  - type: SpaceGarbage
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 2
    trackAllDamage: true
    damageOverlay:
      sprite: _OuterHorizons/Structures/Walls/damage.rsi
  - type: Tag
    tags:
      - Wall
  - type: Sprite
    sprite: _OuterHorizons/Structures/Walls/Planet/asteroid_rock.rsi
    state: full
  - type: Icon
    sprite: _OuterHorizons/Structures/Walls/Planet/asteroid_rock.rsi
    state: full
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_Rock1:
            min: 1
            max: 3
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Rock
  - type: IconSmooth
    key: walls
    base: wall

- type: entity
  parent: OH14_BaseWallStone
  id: OH14_BaseWallStoneOre
  categories: [ ForkFiltered ]
  name: рудная порода
  description: Хранит руды внутри и грейтайдов снаружи.
  components:
  - type: Tag
    tags:
      - Wall
  - type: Sprite
    sprite: _OuterHorizons/Structures/Walls/Planet/asteroid_ore_rock.rsi
    layers:
    - state: full
    - state: ore
  - type: Icon
    sprite: _OuterHorizons/Structures/Walls/Planet/asteroid_ore_rock.rsi
    state: full
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetOre1:
            min: 1
            max: 3
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6

