- type: entity
  id: OH14_Girder
  parent: OH14_BaseStructure
  name: каркас стены
  description: Большая заготовка для самого интересного что есть в этой игре - ебучие текстурки стенок.
  components:
  - type: SpaceGarbage
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 150
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: InteractionOutline
  - type: Construction
    graph: OH14_Girder
    node: OH14_Girder
  - type: Sprite
    sprite: _OuterHorizons/Structures/Walls/girder_wall.rsi
  - type: Icon
    sprite: _OuterHorizons/Structures/Walls/girder_wall.rsi
    state: full
  - type: IconSmooth
    key: walls
    base: wall
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors: #excess damage, don't spawn entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetGirder1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  id: OH14_WindowGirder
  parent: OH14_Girder
  name: каркас окна
  components:
  - type: Construction
    graph: OH14_Window
    node: OH14_WindowGirder
  - type: Sprite
    sprite: _OuterHorizons/Structures/Walls/grider_window.rsi
  - type: Icon
    sprite: _OuterHorizons/Structures/Walls/grider_window.rsi
    state: full
  - type: IconSmooth
    key: walls
    base: wall
  - type: Climbable
