- type: entity
  id: OH14_StairsBasic
  categories: [ ForkFiltered ]
  name: ступеньки
  description: Ты видишь потолок? Нет. А он есть.
  placement:
    mode: SnapgridCenter
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Clickable
  - type: Sprite
    sprite: _OuterHorizons/Structures/stairs.rsi
    state: stairs_stage_steel
    drawdepth: FloorTiles
  - type: Transform
    anchored: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetMaterials1:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: OH14_StairsWhite
  parent: OH14_StairsBasic
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/stairs.rsi
    state: stairs_stage_white
    drawdepth: FloorTiles

- type: entity
  id: OH14_StairsDark
  parent: OH14_StairsBasic
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/stairs.rsi
    state: stairs_stage_dark
    drawdepth: FloorTiles
