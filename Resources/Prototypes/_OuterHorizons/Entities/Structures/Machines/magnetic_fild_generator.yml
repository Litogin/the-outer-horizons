- type: entity
  id: OH14_MagneticFieldGenerator
  name: magnetic fild generator
  parent: BaseMachinePowered
  categories: [ ForkFiltered ]
  description: A machine capable of protecting against a malevolent star that sneezed out its radiation
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Machines/gravity_generator.rsi
    snapCardinals: true
    layers:
      - state: on
        map: ["enum.GravityGeneratorVisualLayers.Base"]
      - state: idle
        shader: unshaded
        map: ["enum.GravityGeneratorVisualLayers.Core"]
  - type: ApcPowerReceiver
    powerLoad: 7000
  - type: MagneticFieldGenerator
    spawn: OH14_MagneticFild
  - type: PowerCharge
    idlePower: 15
    activePower: 7000
  - type: PowerSwitch
