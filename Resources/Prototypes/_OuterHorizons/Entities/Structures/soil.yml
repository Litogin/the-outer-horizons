- type: entity
  id: OH14_Soil
  name: почва
  description: Кучка земли, маленькая, но способная подарить улыбку будучи с живой растительностью.
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.1"
        density: 190
        hard: false
        mask:
        - FullTileMask
        layer:
        - FullTileMask
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Sprite
    sprite: Structures/Hydroponics/misc.rsi
    state: soil
    noRot: true
  - type: PlantHolder
    drawWarnings: false
  - type: SolutionContainerManager
    solutions:
      soil:
        maxVol: 200
  - type: RefillableSolution
    solution: soil
    maxRefill: 50
  - type: Transform
    anchored: true
  - type: Reactive
    reactions:
    - reagents: [Water]
      methods: [Touch, Ingestion, Injection]
      effects:
      - !type:AddReagentToSolution
        reagent: Water
        solution: soil
  - type: Appearance
  - type: PlantHolderVisuals

- type: entity
  id: OH14_PlantPot
  parent: OH14_BaseStructureDynamic
  name: горшок
  description: Горшок для растений с кучкой земли, твоя неловкая попытка озеленить эту консервную банку.
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Pullable
  - type: Clickable
  - type: InteractionOutline
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Sprite
    drawdepth: Mobs
    sprite: _OuterHorizons/Structures/Hydro/main.rsi
    noRot: true
    offset: "0, 0.35"
    layers:
      - state: hydrotray-filled
        offset: "0, -0.35"
  - type: PlantHolder
    wateringSound:
      path: /Audio/Effects/Fluids/slosh.ogg
      params:
        volume: -10
        variation: 0.20
    drawWarnings: false
  - type: SolutionContainerManager
    solutions:
      soil:
        maxVol: 50
  - type: RefillableSolution
    solution: soil
    maxRefill: 50
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Reactive
    reactions:
    - reagents: [Water]
      methods: [Touch, Ingestion, Injection]
      effects:
      - !type:AddReagentToSolution
        reagent: Water
        solution: soil
  - type: Appearance
  - type: PlantHolderVisuals

- type: entity
  id: OH14_PlantPotEmpty
  parent: OH14_PlantPot
  suffix: Empty
  components:
  - type: PlantHolder
    waterLevel: 0
    nutritionLevel: 0
