- type: inventoryTemplate
  id: OH14_Tarrantok
  slots:
    - name: shoes
      slotTexture: shoes
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_down
      slotFlags: FEET
      stripTime: 3
      uiWindowPos: 1,0
      strippingWindowPos: 1,3
      displayName: Shoes
    - name: jumpsuit
      slotTexture: uniform
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_center
      slotFlags: INNERCLOTHING
      stripTime: 6
      uiWindowPos: 1,2
      strippingWindowPos: 0,2
      displayName: Jumpsuit
    - name: outerClothing
      slotTexture: suit
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_down
      slotFlags: OUTERCLOTHING
      stripTime: 6
      uiWindowPos: 2,0
      strippingWindowPos: 1,2
      displayName: Suit
    - name: gloves
      slotTexture: gloves
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_center
      slotFlags: GLOVES
      uiWindowPos: 2,1
      strippingWindowPos: 2,2
      displayName: Gloves
    - name: pants
      slotTexture: pants
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_center
      slotFlags: PANTS
      uiWindowPos: 1,1
      strippingWindowPos: 0,3
      displayName: Pants
    - name: id
      slotTexture: id
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_center
      slotFlags: IDCARD
      dependsOn: jumpsuit
      uiWindowPos: 0,1
      strippingWindowPos: 2,1
      displayName: ID
    - name: neck
      slotTexture: neck
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_center
      slotFlags: NECK
      uiWindowPos: 0,2
      strippingWindowPos: 0,1
      displayName: Neck
    - name: mask
      slotTexture: mask
      slotFlags: MASK
      uiWindowPos: 1,3
      strippingWindowPos: 1,1
      displayName: Mask
    - name: eyes
      slotTexture: glasses
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_center
      slotFlags: EYES
      stripTime: 3
      uiWindowPos: 2,2
      strippingWindowPos: 0,0
      displayName: Eyes
    - name: ears
      slotTexture: ears
      slotFlags: EARS
      stripTime: 3
      uiWindowPos: 2,3
      strippingWindowPos: 2,0
      displayName: Ears
    - name: head
      slotTexture: head
      slotFlags: HEAD
      uiWindowPos: 0,3
      strippingWindowPos: 1,0
      displayName: Head
    - name: pocket1
      slotTexture: pocket
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_down
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 0,3
      strippingWindowPos: 0,4
      dependsOn: pants
      displayName: Pocket 1
      stripHidden: true
    - name: pocket2
      slotTexture: pocket
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_down
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 2,3
      strippingWindowPos: 1,4
      dependsOn: pants
      displayName: Pocket 2
      stripHidden: true
    - name: suitstorage
      slotTexture: suit_storage
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_down
      slotFlags: SUITSTORAGE
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 2,0
      strippingWindowPos: 2,5
      # dependsOn: outerClothing
      dependsOnComponents:
      - type: AllowSuitStorage
      displayName: Suit Storage
    - name: tailbag
      slotTexture: tailbag
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_down
      slotFlags: TAILBAG
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 3,2
      strippingWindowPos: 2,4
      displayName: Tailbag
    - name: belt
      slotTexture: belt
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_down
      slotFlags: BELT
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 3,1
      strippingWindowPos: 1,5
      displayName: Belt
    - name: back
      slotTexture: back
      fullTextureName: /Textures/Interface/_OuterHorizons/SlotBackground_down
      slotFlags: BACK
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 3,0
      strippingWindowPos: 0,5
      displayName: Back
