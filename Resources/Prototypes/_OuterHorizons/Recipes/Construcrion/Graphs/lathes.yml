- type: constructionGraph
  id: OH14_AutolatheFrame
  start: start
  graph:
    - node: start
      edges:
        - to: frame1
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: OH14_Girders
              amount: 2
              doAfter: 1
    - node: frame1
      entity: OH14_FrameAutolathe
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: OH14_SheetGirder1
              amount: 2
            - !type:DeleteEntity {}
          conditions:
            - !type:EntityAnchored
              anchored: false
          steps:
            - tool: Screwing
              doAfter: 2
        - to: frame2
          conditions:
            - !type:EntityAnchored
              anchored: true
          steps:
            - material: OH14_Components
              amount: 2
              doAfter: 1
            - tool: Screwing
              doAfter: 1
    - node: frame2
      actions:
      - !type:AppearanceChange
      entity: OH14_FrameAutolathe
      edges:
        - to: frame3
          conditions:
            - !type:EntityAnchored
              anchored: true
          steps:
            - material: OH14_Electronic
              amount: 1
              doAfter: 1
            - tool: Screwing
              doAfter: 1
    - node: frame3
      actions:
      - !type:AppearanceChange
      entity: OH14_FrameAutolathe
      edges:
        - to: OH14_Autolathe
          conditions:
            - !type:EntityAnchored
              anchored: true
          steps:
            - material: OH14_Materials
              amount: 2
              doAfter: 1
            - tool: Screwing
              doAfter: 1
    - node: OH14_Autolathe
      entity: OH14_AutoLathe
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers {}
            - !type:SpawnPrototype
              prototype: OH14_SheetMaterials1
              amount: 4
            - !type:SpawnPrototype
              prototype: OH14_SheetElectronics1
              amount: 1
            - !type:SpawnPrototype
              prototype: OH14_SheetComponents1
              amount: 2
            - !type:DeleteEntity {}
          conditions:
            - !type:EntityAnchored
              anchored: false
          steps:
            - tool: Prying
              doAfter: 1
            - tool: Screwing
              doAfter: 1
            - tool: Prying
              doAfter: 1



