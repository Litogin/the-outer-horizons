- type: constructionGraph
  id: OH14_Airlock
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: OH14_AirlockGirder
          # completed:
          #   - !type:SnapToGrid
          #     southRotation: true
          steps:
            - material: OH14_Girders
              amount: 2
              doAfter: 1
    - node: OH14_AirlockGirder
      entity: OH14_AirlockAssembly
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: OH14_SheetGirder1
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 1
        - to: OH14_Airlock
          steps:
            - material: OH14_SheetIron
              amount: 2
              doAfter: 1
            - material: OH14_Component
              amount: 4
              doAfter: 1
            - component: DoorElectronics
              store: board
              name: construction-graph-component-door-electronics-circuit-board
              icon:
                sprite: "_OuterHorizons/Objects/Materials/circuitboard.rsi"
                state: "door_board"
              doAfter: 3
        - to: OH14_AirlockDock
          steps:
            - material: OH14_Component
              amount: 8
              doAfter: 1
            - material: OH14_SheetIron
              amount: 2
              doAfter: 1
            - component: DoorElectronics
              store: board
              name: construction-graph-component-door-electronics-circuit-board
              icon:
                sprite: "_OuterHorizons/Objects/Materials/circuitboard.rsi"
                state: "door_board"
              doAfter: 3
    - node: OH14_Airlock
      entity: OH14_Airlock
      edges:
        - to: OH14_AirlockGirder
          conditions:
          - !type:EntityAnchored {}
          # - !type:DoorWelded {}
          - !type:DoorBolted
            value: false
          - !type:WirePanel {}
          - !type:AllWiresCut
          completed:
            - !type:EmptyAllContainers
              pickup: true
              emptyAtUser: true
            - !type:SpawnPrototype
              prototype: OH14_SheetIron1
              amount: 2
            - !type:SpawnPrototype
              prototype: OH14_Component1
              amount: 4
          steps:
            - tool: Prying
              doAfter: 1
    - node: OH14_AirlockDock
      entity: OH14_ShuttleDock
      edges:
        - to: OH14_AirlockGirder
          conditions:
          - !type:EntityAnchored {}
          # - !type:DoorWelded {}
          - !type:DoorBolted
            value: false
          - !type:WirePanel {}
          - !type:AllWiresCut
          completed:
            - !type:EmptyAllContainers
              pickup: true
              emptyAtUser: true
            - !type:SpawnPrototype
              prototype: OH14_SheetIron1
              amount: 2
            - !type:SpawnPrototype
              prototype: OH14_Component1
              amount: 8
          steps:
            - tool: Prying
              doAfter: 1
