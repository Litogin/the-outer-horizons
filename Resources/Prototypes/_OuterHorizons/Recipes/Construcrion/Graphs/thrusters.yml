- type: constructionGraph
  id: OH14_ThrusterR
  start: start
  graph:
    - node: start
      edges:
        - to: frame1
          completed:
            - !type:SetAnchor
              value: false
          steps:
            - material: OH14_Girders
              amount: 2
              doAfter: 1

    - node: frame1
      entity: OH14_FrameThrusterR
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: OH14_SheetGirder1
              amount: 2
            - !type:DeleteEntity {}
          conditions:
            - !type:EntityAnchored
              anchored: false
          steps:
            - tool: Screwing
              doAfter: 2
        - to: frame2
          conditions:
            - !type:EntityAnchored
              anchored: true
          steps:
            - material: OH14_SheetIron
              amount: 2
              doAfter: 1

    - node: frame2
      actions:
      - !type:AppearanceChange
      entity: OH14_FrameThrusterR
      edges:
        - to: frame1
          completed:
            - !type:SpawnPrototype
              prototype: OH14_SheetIron1
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 2
        - to: frame3
          conditions:
            - !type:EntityAnchored
              anchored: true
          steps:
            - tag: OH14_HeatChamber
              name: construction-graph-tag-heatchamber
              doAfter: 1
    - node: frame3
      actions:
      - !type:AppearanceChange
      entity: OH14_FrameThrusterR
      edges:
        - to: frame2
          completed:
            - !type:SpawnPrototype
              prototype: OH14_HeatChamber
              amount: 1
          steps:
            - tool: Screwing
              doAfter: 2
        - to: OH14_ThrusterR
          conditions:
            - !type:EntityAnchored
              anchored: true
          steps:
            - tag: OH14_Motor
              name: construction-graph-tag-motor
              doAfter: 1
    - node: OH14_ThrusterR
      entity: OH14_ThrusterPressureRed
      edges:
        - to: frame3
          completed:
            - !type:SpawnPrototype
              prototype: OH14_Motor
              amount: 1
          conditions:
            - !type:EntityAnchored
              anchored: false
          steps:
            - tool: Screwing
              doAfter: 2
            - tool: Prying
              doAfter: 5

# Гиро

- type: constructionGraph
  id: OH14_Gyroscope
  start: start
  graph:
