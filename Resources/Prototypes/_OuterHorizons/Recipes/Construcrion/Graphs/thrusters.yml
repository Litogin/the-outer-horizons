          steps:
            - tool: Screwing
              doAfter: 2
        - to: OH14_Gyroscope
          conditions:
            - !type:EntityAnchored
              anchored: true
          steps:
            - material: OH14_Component
              amount: 4
              doAfter: 1
    - node: OH14_Gyroscope
