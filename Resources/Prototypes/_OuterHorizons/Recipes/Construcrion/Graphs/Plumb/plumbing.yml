- type: constructionGraph
  id: OH14_PlumbingPipe
  start: start
  graph:
  - node: start
    edges:
    - to: OH14_PlumbingDuctStraight
      steps:
      - material: OH14_Piping
        amount: 1
        doAfter: 1
    - to: OH14_PlumbingDuctBend
      steps:
      - material: OH14_Piping
        amount: 1
        doAfter: 1
    - to: OH14_PlumbingDuctTJunction
      steps:
      - material: OH14_Piping
        amount: 1
        doAfter: 1
    - to: OH14_PlumbingDuctFourway
      steps:
      - material: OH14_Piping
        amount: 1
        doAfter: 1

  - node: OH14_PlumbingDuctStraight
    entity: OH14_PlumbingDuctStraight
    edges:
    - to: start
      conditions:
      - !type:EntityAnchored
        anchored: false
      completed:
      - !type:SpawnPrototype
        prototype: OH14_SheetPipes1
        amount: 1
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 1
