- type: constructionGraph
  id: OH14_Console
  start: start
  graph:
    - node: start
      edges:
        - to: frame1
          completed:
            - !type:SetAnchor
              value: false
          steps:
            - material: OH14_Girders
              amount: 2
              doAfter: 2

    - node: frame1
      actions:
      - !type:AppearanceChange
      entity: OH14_ConsoleFrame
      edges:
        - to: frame2
          conditions:
            - !type:EntityAnchored {}
          steps:
            - component: ComputerBoard
              store: board
              name: construction-graph-component-any-computer-circuit-board

        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: OH14_SheetGirder1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2

    - node: frame2
      actions:
      - !type:AppearanceChange
      edges:
        - to: frame3
          conditions:
            - !type:EntityAnchored {}
          steps:
            - tag: OH14_PowerUnitComplete
              name: construction-graph-tag-powerunit
              doAfter: 1

        - to: frame1
          conditions:
            - !type:EntityAnchored { }
          completed:
            - !type:EmptyAllContainers {}
          steps:
            - tool: Prying
              doAfter: 1

    - node: frame3
      entity: OH14_ConsoleFrame
      actions:
      - !type:AppearanceChange
      edges:
        - to: computer
          conditions:
            - !type:EntityAnchored {}
          steps:
            - tag: OH14_ControlUnitComplete
              name: construction-graph-tag-controlunit
              doAfter: 1

        - to: frame2
          conditions:
            - !type:EntityAnchored { }
          completed:
            - !type:SpawnPrototype
              prototype: OH14_PowerUnitComplete
              amount: 1
          steps:
            - tool: Screwing
              doAfter: 1

    - node: computer
      entity: !type:BoardNodeEntity { container: board }
      edges:
        - to: frame3
          conditions:
            - !type:WirePanel
              open: true
          completed:
            - !type:RaiseEvent
                event: !type:MachineDeconstructedEvent
            - !type:SpawnPrototype
              prototype: OH14_ControlUnitComplete
              amount: 1
          steps:
            - tool: Prying
              doAfter: 1

    - node: monitorBroken
      entity: OH14_ConsoleBroken
      edges:
        - to: frame1
          conditions:
            - !type:EntityAnchored {}
          completed:
            - !type:SpawnPrototype
              prototype: OH14_Circuit1
              amount: 2
          steps:
            - tool: Prying
              doAfter: 2
