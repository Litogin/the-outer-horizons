- type: constructionGraph
  id: OH14_AutolatheFrame
  start: start
  graph:
    - node: start
      edges:
        - to: frame1
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: OH14_Girders
              amount: 2
              doAfter: 1
    - node: frame1
      entity: OH14_FrameAutolathe
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: OH14_SheetGirder1
              amount: 2
            - !type:DeleteEntity {}
          conditions:
            - !type:EntityAnchored
              anchored: false
          steps:
            - tool: Screwing
              doAfter: 2
        - to: frame2
          conditions:
            - !type:EntityAnchored
              anchored: true
          steps:
            - material: OH14_Component
              amount: 4
              doAfter: 1
    - node: frame2
      actions:
      - !type:AppearanceChange
      entity: OH14_FrameAutolathe
      edges:
        - to: frame1
          completed:
            - !type:SpawnPrototype
              prototype: OH14_Component1
              amount: 2
          steps:
            - tool: Prying
              doAfter: 1
        - to: frame3
          conditions:
            - !type:EntityAnchored
              anchored: true
          steps:
            - tag: OH14_AnalogBoardComplete
              name: construction-graph-tag-analogboard
              doAfter: 1
    - node: frame3
      actions:
      - !type:AppearanceChange
      entity: OH14_FrameAutolathe
      edges:
        - to: frame2
          completed:
            - !type:SpawnPrototype
              prototype: OH14_AnalogBoardComplete
              amount: 1
          steps:
            - tool: Prying
              doAfter: 1
        - to: OH14_Autolathe
          conditions:
            - !type:EntityAnchored
              anchored: true
          steps:
            - tag: OH14_CrtScreen
              name: construction-graph-tag-crtscreen
              doAfter: 1
        - to: OH14_AutoLatheTools
          conditions:
            - !type:EntityAnchored
              anchored: true
          steps:
            - tag: OH14_AutoLatheUpgradeTools
              store: board
              name: construction-graph-tag-board
              doAfter: 1
    - node: OH14_Autolathe
      entity: OH14_AutoLathe
      edges:
        - to: frame3
          completed:
            - !type:SpawnPrototype
              prototype: OH14_CrtScreen
              amount: 1
          steps:
            - tool: Screwing
              doAfter: 1
            - tool: Prying
              doAfter: 1
    - node: OH14_AutoLatheTools
      entity: OH14_AutoLatheTools
      edges:
        - to: frame3
          completed:
            - !type:SpawnPrototype
              prototype: OH14_CircuitboardUpgradeAutolathe
              amount: 1
          steps:
            - tool: Screwing
              doAfter: 1
            - tool: Prying
              doAfter: 1

