- type: entity
  id: OH14_BaseAsteroidDebris
  parent: BaseDebris
  name: asteroid debris
  abstract: true
  components:
    - type: MapGrid
    - type: BlobSmoothFloorPlanBuilder
      floorTileset:
      - OH14_IceMoon
      crustTileset:
      - OH14_Ice
      blobDrawProb: 0.5
      radius: 6
      floorPlacements: 16
      crustLayers: 4
    - type: SimpleFloorPlanPopulator
      entries:
        OH14_IceMoon:
          - id: OH14_BaseWallStone
            prob: 0.5
            orGroup: rock
          - id: OH14_BaseWallIce
            prob: 0.1
            orGroup: rock
          - id: OH14_BaseWallStoneOre
            prob: 0.02
            orGroup: rock
    - type: IFF
      flags: HideLabel
      color: "#BDA89A"
    - type: Shuttle
      bodyModifier: 5

- type: entity
  id: OH14_AsteroidDebrisSmall
  parent: OH14_BaseAsteroidDebris
  name: asteroid debris small
  categories: [ HideSpawnMenu ]
  components:
    - type: MapGrid
    - type: BlobSmoothFloorPlanBuilder
